
name: Extrair projeto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair arquivos do projeto
        run: |
          unzip -o APKEditorPro-Android-GitHub.zip -d /tmp/projeto
          cp -a /tmp/projeto/APKEditorProAndroid/. .

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle settings.gradle gradle.properties original-source README.md .github/workflows/build-apk.yml .github/workflows/extrair-projeto.yml
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar projeto Android APK Editor Pro"
            git push
          fi
