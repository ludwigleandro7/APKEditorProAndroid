
name: Extrair projeto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Verificar e extrair ZIP
        run: |
          set -e
          ZIP="APKEditorPro-Android-GitHub.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo ZIP nao encontrado na raiz."
            ls -la
            exit 1
          fi
          mkdir -p extraido
          unzip -o "$ZIP" -d extraido
          echo "Conteudo do ZIP:"
          find extraido -maxdepth 4 -type f | head -100

      - name: Publicar arquivos extraidos
        run: |
          set -e
          cp -a extraido/. .
          rm -rf extraido
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Extrair arquivos do projeto Android"
            git push
          fi
