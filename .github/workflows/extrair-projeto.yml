YAML

name: Extrair projeto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto ZIP
        run: |
          mkdir -p projeto
          unzip -o APKEditorPro-Android-GitHub.zip -d projeto
          echo "Arquivos extraidos:"
          find projeto -maxdepth 3 -type f | head -100

      - name: Salvar arquivos extraidos no repositorio
        run: |
          cp -a projeto/. .
          rm -rf projeto
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Extrair projeto Android do ZIP"
            git push
          fi
