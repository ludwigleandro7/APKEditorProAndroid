
name: Extrair projeto e gerar APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'APKEditorPro-Android-GitHub.zip'
      - '.github/workflows/extrair-projeto.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Verificar arquivo ZIP
        shell: bash
        run: |
          if [ ! -f "APKEditorPro-Android-GitHub.zip" ]; then
            echo "ERRO: ZIP nao encontrado na raiz do repositorio."
            echo "Arquivos encontrados:"
            ls -la
            exit 1
          fi
          echo "ZIP encontrado."

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Extrair projeto
        shell: bash
        run: |
          mkdir -p projeto
          unzip -o "APKEditorPro-Android-GitHub.zip" -d projeto
          echo "Conteudo extraido:"
          find projeto -maxdepth 4 -type f | head -200

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE/projeto"

          if [ -f "$ROOT/gradlew" ]; then
            DIR="$ROOT"
          else
            DIR=$(find "$ROOT" -type f \
              -name gradlew -print -quit | xargs -r dirname)
          fi

          if [ -z "$DIR" ]; then
            if [ -f "$ROOT/build.gradle" ] || \
               [ -f "$ROOT/build.gradle.kts" ]; then
              DIR="$ROOT"
            else
              DIR=$(find "$ROOT" -type f \
                \( -name build.gradle -o \
                   -name build.gradle.kts \) \
                -print -quit | xargs -r dirname)
            fi
          fi

          if [ -z "$DIR" ]; then
            echo "ERRO: projeto Gradle nao encontrado."
            echo "Verifique se o ZIP contem o codigo-fonte Android."
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado em: $DIR"

      - name: Compilar aplicativo Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: APKEditorPro-APK
          path: projeto/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
